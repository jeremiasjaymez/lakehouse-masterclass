services:
  vault:
    image: hashicorp/vault:1.18.5
    container_name: vault
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
      # Para que `docker exec vault vault kv ...` funcione sin exportar nada:
      # el CLI adentro del contenedor asume HTTPS y no tiene token.
      VAULT_ADDR: "http://127.0.0.1:8200"
      VAULT_TOKEN: root
      SKIP_SETCAP: "true"
    cap_add:
      - IPC_LOCK

networks:
  default:
    name: lakehouse
